<article class="experience-card">
  <header class="experience-header">
    <img src="{{imageSrc}}" alt="{{name}} Logo" width="64" height="64" draggable="false">
    <div>
      <h3>{{{nameMarkup}}}</h3>
      <p>{{description}}</p>
      <p class="experience-time">{{time}}</p>
    </div>
  </header>
  <div class="experience-body">
    <h3>Role</h3>
    <p>{{role}}</p>
    <h3>Experience</h3>
    <p>{{experience}}</p>
  </div>
</article>
